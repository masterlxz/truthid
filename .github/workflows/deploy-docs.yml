name: Deploy Docs

# Builda e publica a doc (Fumadocs, dentro de site/frontend) no GitHub Pages a
# cada push na main que toque site/frontend/. Só a doc vai pro ar aqui — a
# landing page e o /dashboard (login/OAuth) são removidos antes do build,
# porque essa é uma exportação estática sem o backend Rails por trás
# (ver project/ROADMAP.md, Sessão 200).
on:
  push:
    branches: [main]
    paths:
      - 'site/frontend/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys simultâneos disputando o mesmo ambiente
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Install dependencies
        working-directory: site/frontend
        run: npm ci

      - name: Remove routes that need the Rails backend (landing page, dashboard)
        working-directory: site/frontend
        run: rm -f "app/[locale]/page.tsx" && rm -rf "app/[locale]/dashboard"

      - name: Build static export
        working-directory: site/frontend
        env:
          NEXT_BASE_PATH: /truthid
        run: npm run build

      - name: Promote docs intro to site root
        working-directory: site/frontend/out
        run: cp docs/intro.html index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
