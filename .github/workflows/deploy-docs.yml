name: Deploy Docs

# Builda e publica a doc (Fumadocs, dentro de site/frontend), a landing
# pública (instaladores) e o repositório APT (project/ROADMAP.md, seção
# "Instaladores nativos", Sessões 215/217) no GitHub Pages. O
# actions/deploy-pages substitui o site inteiro a cada deploy (um artifact
# só) — por isso o repo APT é remontado do zero em toda execução, não só
# quando um release novo sai, senão um push de doc sem release novo
# apagaria o /apt/ do ar. A landing (app/page.tsx + app/[locale]/page.tsx) é
# estática, sem dependência do backend Rails, então vai pro ar; só o login
# OAuth (/signin) e o /dashboard são removidos antes do build, porque essa é
# uma exportação estática sem o backend Rails por trás (ver
# project/ROADMAP.md, Sessão 200; project/PENDING.md P57).
on:
  push:
    branches: [main]
    paths:
      - 'site/frontend/**'
      - 'scripts/build-apt-repo.sh'
      - '.github/workflows/deploy-docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys simultâneos disputando o mesmo ambiente
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Install dependencies
        working-directory: site/frontend
        run: npm ci

      - name: Remove routes that need the Rails backend (signin, dashboard)
        working-directory: site/frontend
        run: rm -rf "app/[locale]/signin" "app/[locale]/dashboard"

      - name: Build static export
        working-directory: site/frontend
        env:
          NEXT_BASE_PATH: /truthid
        run: npm run build

      - name: Install apt repo tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils gnupg2

      - name: Download latest .deb release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern "*_amd64.deb" --dir /tmp/apt-src --clobber

      - name: Import APT signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME=/tmp/apt-gnupg
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build APT repo
        env:
          GNUPGHOME: /tmp/apt-gnupg
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          DEB_FILE=$(find /tmp/apt-src -name '*_amd64.deb' | head -n1)
          bash scripts/build-apt-repo.sh "$DEB_FILE" site/frontend/out/apt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
