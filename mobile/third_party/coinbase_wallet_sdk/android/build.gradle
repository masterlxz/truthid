group 'com.coinbase.coinbase_wallet_sdk'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.6.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.coinbase.flutter.wallet_sdk"
    // Vendorizado do pub.dev 1.0.10 (P86): o pacote publicado trava em 31,
    // incompatível com ~20 libs androidx mais novas no grafo do reown_appkit
    // (exige >= 33/34). Bump pra 36 pra bater com o compileSdk do app.
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles "consumer-rules.pro"
        proguardFiles "proguard-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.coinbase:coinbase-wallet-sdk:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.3"
}
